<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gdrv-sync</title>
    <style>
        :root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2537;--line:#2a3550;--text:#dbe3f4;--muted:#8b98b8;--accent:#4f8cff;--accent2:#3b6fe0;--ok:#3ecf8e;--warn:#f5c451;--err:#ff6b6b;--radius:12px}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        header{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
        header .logo{font-weight:700;font-size:16px;letter-spacing:.3px;margin-right:6px}
        header .logo span{color:var(--accent)}
        .badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
        .badge.ok{color:var(--ok);border-color:var(--ok)}
        .badge.off{color:var(--err);border-color:var(--err)}
        header .spacer{flex:1}
        .langbtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
        .langbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .langbtn:hover{border-color:var(--accent)}
        main{display:flex;max-width:1150px;margin:0 auto;padding:22px;gap:22px}
        nav{width:170px;flex-shrink:0}
        nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);font:inherit;padding:10px 14px;border-radius:8px;cursor:pointer;margin-bottom:4px}
        nav button.active{background:var(--accent);color:#fff}
        nav .navsub{font-size:11px;color:var(--muted);padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.5px}
        section.view{flex:1;display:none;min-width:0}
        section.view.active{display:block}
        .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
        .card h2{font-size:15px;margin-bottom:4px}
        .card .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
        label.f{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
        .row{display:flex;gap:10px;align-items:center}
        input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px;font:inherit}
        input:focus,select:focus{outline:none;border-color:var(--accent)}
        .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;white-space:nowrap}
        .btn:hover{background:var(--accent2)}
        .btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
        .btn.ghost:hover{border-color:var(--accent)}
        .btn.small{padding:5px 10px;font-size:12px}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        /* tabs por provedor */
        .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
        .tabs button{background:none;border:none;color:var(--muted);font:inherit;padding:9px 16px;cursor:pointer;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
        .tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:var(--panel2)}
        .connstat{font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
        .connstat.ok{background:rgba(62,207,142,.1);color:var(--ok)}
        .connstat.off{background:rgba(255,107,107,.08);color:var(--err)}
        .connstat .spacer{flex:1}
        .pcard{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#131a29}
        .dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .dir{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel2)}
        .dir.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
        .dir b{display:block;font-size:13px;margin-bottom:2px}
        .dir small{color:var(--muted);font-size:11px}
        .warnbox{margin-top:12px;font-size:12px;color:var(--warn);background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.3);border-radius:8px;padding:8px 12px;display:none}
        .warnbox.show{display:block}
        .adv{border:1px dashed var(--line);border-radius:8px;padding:12px;display:none;max-width:560px;margin-top:12px}
        .adv.show{display:block}
        .adv summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:6px}
        .toggle{position:relative;width:42px;height:23px;flex-shrink:0;display:inline-block}
        .toggle input{display:none}
        .toggle span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s}
        .toggle span::after{content:"";position:absolute;top:2.5px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
        .toggle input:checked+span{background:var(--ok)}
        .toggle input:checked+span::after{left:21px}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{color:var(--muted);text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
        td{padding:9px 10px;border-bottom:1px solid var(--line)}
        .st{font-size:12px;padding:2px 9px;border-radius:12px}
        .st.ok{color:var(--ok);background:rgba(62,207,142,.12)}
        .st.run{color:var(--accent);background:rgba(79,140,255,.12)}
        .st.err{color:var(--err);background:rgba(255,107,107,.12)}
        .st.wait{color:var(--muted);background:rgba(139,152,184,.12)}
        pre.log{background:#0b0f18;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;line-height:1.7;overflow-x:auto;color:#9fb0d0;max-height:220px}
        pre.log .t{color:#54627e}
        .connect-steps{list-style:none}
        .connect-steps li{display:flex;gap:10px;padding:8px 0;color:var(--muted);border-bottom:1px dashed var(--line)}
        .connect-steps li:last-child{border-bottom:none}
        .connect-steps li .ic{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
        .connect-steps li.done{color:var(--text)}
        .connect-steps li.done .ic{background:rgba(62,207,142,.15);border-color:var(--ok);color:var(--ok)}
        .connect-steps li.spin .ic{border-color:var(--accent);color:var(--accent);animation:pulse 1s infinite}
        @keyframes pulse{50%{opacity:.4}}
        /* modal browse */
        .overlay{position:fixed;inset:0;background:rgba(5,8,15,.7);display:none;align-items:center;justify-content:center;z-index:20}
        .overlay.show{display:flex}
        .modal{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
        .modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
        .modal .mhead b{flex:1;font-size:14px}
        .modal .mhead .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
        .crumbs{padding:10px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2)}
        .crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
        .folderlist{max-height:300px;overflow-y:auto;padding:8px}
        .folderlist .fitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
        .folderlist .fitem:hover{background:var(--panel2)}
        .folderlist .fitem .ico{font-size:16px}
        .folderlist .fitem .nm{flex:1}
        .folderlist .fitem .gt{color:var(--muted);font-size:12px}
        .folderlist .root-item{color:var(--accent)}
        .modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
        .sel-label{font-size:12px;color:var(--muted);margin-right:auto;align-self:center}
        .footnote{text-align:center;color:var(--muted);font-size:11px;padding:18px}
        .cmdprev{font-size:12px;color:var(--muted)}
        .cmdprev code{color:var(--accent)}
    </style>
</head>
<body>
<header>
    <div class="logo">gdrv<span>·</span>sync</div>
    <span id="provBadges" style="display:flex;gap:8px"></span>
    <span class="badge {% if healthz_ok %}ok{% else %}off{% endif %}" id="healthBadge" title="{{ t('healthz_title') }}">container: {% if healthz_ok %}{{ t('header_healthy') }}{% else %}{{ t('header_degraded') }}{% endif %}</span>
    <div class="spacer"></div>
    <div id="langToggle" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)">
        <span style="color:var(--muted)">{{ t('lang_label') }}</span>
        <button class="langbtn {% if lang == 'pt' %}active{% endif %}" onclick="setLang('pt')">{{ t('lang_pt') }}</button>
        <button class="langbtn {% if lang == 'en' %}active{% endif %}" onclick="setLang('en')">{{ t('lang_en') }}</button>
    </div>
</header>
<main>
    <nav>
        <button data-view="settings" onclick="go('settings')">{{ t('nav_settings') }}</button>
        <button data-view="connect" onclick="go('connect')">{{ t('nav_connect') }}</button>
        <button data-view="status" onclick="go('status')">{{ t('nav_status') }}</button>
        <div class="navsub">{{ t('navsub_volumes') }}</div>
        <div style="font-size:11px;color:var(--muted);padding:4px 14px">{{ t('vol_data') }}<br>{{ t('vol_sync') }}</div>
    </nav>
<script>
// i18n (embedded by the server): window.__I18N = {pt:{...}, en:{...}, lang:'pt'|'en'}.
window.__I18N = {{ i18n_json | safe }};
window.__LANG = window.__I18N.lang;
function t(k){
  const dict = (window.__I18N && window.__I18N[window.__LANG]) || {};
  return dict[k] || k;
}
function setLang(lang){
  document.cookie = `gdrv_lang=${lang};path=/;max-age=31536000`;
  location.reload();
}
</script>
    {% block content %}{% endblock %}
</main>
<script>
// Navigation between pages (server-rendered sections).
const VIEWS={settings:'/',connect:'/connect',status:'/status'};
function go(v){ if(VIEWS[v] && location.pathname!==VIEWS[v]) location.href=VIEWS[v]; }
// Highlight the nav button matching the current path.
(function(){
  const path = location.pathname;
  document.querySelectorAll('nav button[data-view]').forEach(b=>{
    b.classList.toggle('active', VIEWS[b.dataset.view]===path);
  });
})();
// Poll /healthz every 30s: container badge + per-provider badges.
const PLABELS={gdrive:t('nav_connect'),dropbox:t('nav_connect'),onedrive:t('nav_connect')};
async function pollHealth(){
  try{
    const r=await fetch('/healthz'); const j=await r.json();
    const b=document.getElementById('healthBadge');
    if(j.ok){b.className='badge ok';b.textContent=t('header_healthy');}
    else {b.className='badge off';b.textContent=t('header_degraded');}
    const pb=document.getElementById('provBadges');
    if(pb && j.providers){
      pb.innerHTML=Object.entries(j.providers).map(([k,v])=>{
        const cls=v.connected?'badge ok':'badge off';
        return `<span class="${cls}" title="${t('nav_connect')}">${k} ${v.connected?'✓':'✗'}</span>`;
      }).join('');
    }
  }catch(e){}
}
setInterval(pollHealth,30000); pollHealth();
</script>
</body>
</html>
