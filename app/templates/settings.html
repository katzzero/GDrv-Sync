{% extends "base.html" %}
{% block content %}
<section class="view active" id="view-settings">
    <div class="card">
        <h2>{{ t('settings_title') }}</h2>
        <div class="sub">{{ t('settings_sub') }}</div>

        <!-- Providers badges (connected state) rendered by JS from /healthz -->
        <div class="tabs" id="tabs"></div>
        <div id="tabpane"></div>
    </div>
</section>

<script>
const PROVIDERS = ['gdrive', 'dropbox', 'onedrive'];
const LABELS = {gdrive:t('prov_gdrive'), dropbox:t('prov_dropbox'), onedrive:t('prov_onedrive')};
const SUBS = {gdrive:'Gdrive', dropbox:'Dropbox', onedrive:'Onedrive'};
const DEDICATED = 'GDrv-Folder';
let state = {}; // provider -> {connected, enabled, direction, interval, remote, local_sub, mirror}
let active = 'gdrive';

// Escape user-controlled values for safe insertion into HTML (M8: stored XSS).
function escapeHtml(t){
  return String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(t){ return escapeHtml(t); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = PROVIDERS.map(p =>
    `<button class="${p===active?'on':''}" onclick="setTab('${p}')">${escapeHtml(LABELS[p])}</button>`).join('');
}
function setTab(p){active=p; renderTabs(); renderPane();}

async function load(){
  const [s, h] = await Promise.all([
    fetch('/api/settings').then(r=>r.json()),
    fetch('/healthz').then(r=>r.json()),
  ]);
  state = (s.providers || {});
  const provState = (h.providers || {});
  PROVIDERS.forEach(p=>{
    if(!state[p]) state[p] = {enabled:false, direction:'upload', interval_min:5, remote:'', local_sub:SUBS[p], mirror:false};
    if(!state[p].local_sub) state[p].local_sub = SUBS[p];
    state[p].connected = provState[p]?.connected ?? false;
    state[p].enabled = provState[p]?.enabled ?? !!state[p].enabled;
    // default mirror false (never delete anything by default)
    if(state[p].mirror === undefined) state[p].mirror = false;
  });
  renderTabs(); renderPane();
}

function renderPane(){
  const p = active, s = state[p] || {};
  const connected = s.connected;
  const localSub = s.local_sub || SUBS[p];
  const local = `/sync/${localSub}`;
  const canEnable = connected;
  const isBisync = s.direction === 'bisync';
  // mirror only meaningful for one-way directions
  const mirrorAllowed = !isBisync;
  const mirror = !!s.mirror;

  const connHtml = connected
    ? `<div class="connstat ok">✓ <code>${escapeHtml(p)}</code> ${t('conn_authenticated').replace('{provider}', escapeHtml(p))} <div class="spacer"></div><button class="btn small ghost" onclick="go('connect')">${t('btn_reconnect')}</button></div>`
    : `<div class="connstat off">✗ <code>${escapeHtml(p)}</code> ${t('conn_not_authenticated').replace('{provider}', escapeHtml(p))} <div class="spacer"></div><button class="btn small ghost" onclick="go('connect')">${t('btn_connect')}</button></div>`;

  const dirs = ['upload','download','bisync'].map(d=>{
    let label, note;
    if(d==='upload'){
      label=t('dir_upload_label');
      note=t('dir_upload_note');
    } else if(d==='download'){
      label=t('dir_download_label');
      note=t('dir_download_note');
    } else {
      label=t('dir_bisync_label');
      note=t('dir_bisync_note');
    }
    const sel = s.direction===d?'sel':'';
    const disabled = (d==='bisync' && mirror) ? ' disabled' : '';
    return `<div class="dir ${sel}${disabled}" onclick="setDir('${d}')"><b>${label}</b><small>${note}</small></div>`;
  }).join('');

  // Keep the remote exactly as sent by browse ("gdrive:" for root) — do NOT strip the colon (H1).
  const remoteVal = s.remote || '';
  const remotePlaceholder = `${p}:`;
  const remoteEscaped = escapeAttr(remoteVal);
  const placeholderEscaped = escapeAttr(remotePlaceholder);

  // Mirror warning box text (where deleted/extras go).
  let mirrorWhere = '';
  if(directionOneWay(s.direction)==='upload'){
    mirrorWhere = `<code>${escapeHtml(p)}:.gdrv-deleted/<UTC-ts></code> (${t('cloud_root_upload_where')})`;
  } else if(directionOneWay(s.direction)==='download'){
    mirrorWhere = `<code>./data/deleted/${escapeHtml(p)}/<UTC-ts></code> (${t('cloud_root_download_where')})`;
  }
  const rootIsSelected = (remoteVal === `${p}:`) || remoteVal === '';
  const rootDanger = mirror && s.direction==='upload' && rootIsSelected
    ? `<div style="color:var(--err);margin-top:6px;font-size:11.5px"><strong>${t('root_danger_strong')}:</strong> ${t('root_danger_remote').replace('{provider}', escapeHtml(p))} ${t('root_danger_body')}</div>`
    : '';

  const editNote = s.enabled ? t('local_hub_edit_note') : '';
  document.getElementById('tabpane').innerHTML = `
    ${connHtml}
    <div class="row" style="margin-top:14px">
      <div style="flex:1">
        <label class="f">${t('label_local_folder')}</label>
        <div class="row">
          <input type="text" id="localsub-${p}" value="${escapeAttr(localSub)}" ${s.enabled?'readonly':''}>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${t('local_folder_help').replace('{edit_note}', editNote)}</div>
      </div>
      <div style="flex:1">
        <label class="f">${t('label_cloud_folder')}</label>
        <div class="row">
          <input type="text" id="remote-${p}" value="${remoteEscaped}" placeholder="${placeholderEscaped}">
          <button class="btn ghost" onclick="openBrowse('${p}')" ${!connected?'disabled':''}>${t('btn_browse')}</button>
        </div>
        ${connected && (remoteVal === '' || remoteVal === p+':')
          ? `<button class="btn small ghost" style="margin-top:6px" onclick="useDedicated('${p}', this)">${t('btn_dedicated').replace('{dedicated}', DEDICATED)}</button>` : ''}
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${t('cloud_root').replace('{provider}', escapeHtml(p))}</div>
        <div id="ded-warn-${p}" class="warnbox" style="margin-top:6px"></div>
      </div>
    </div>
    <label class="f" style="margin-top:16px">${t('label_direction')}</label>
    <div class="dirs">${dirs}</div>
    ${!mirrorAllowed && mirror
      ? `<div class="warnbox show" style="color:var(--err)">${t('mirror_not_allowed_bisync')}</div>`
      : ''}
    <div class="row" style="margin-top:14px">
      <div style="flex:1;display:flex;align-items:center;gap:10px">
        <label class="toggle" style="margin:0">
          <input type="checkbox" id="mirror-${p}" ${mirror?'checked':''} ${!mirrorAllowed?'disabled':''} onchange="toggleMirror('${p}')"><span></span>
        </label>
        <span style="font-size:12.5px;color:var(--text)"><strong>${t('label_mirror')}</strong></span>
      </div>
    </div>
    <div class="warnbox ${(mirror && mirrorAllowed)?'show':''}" id="mirror-warn-${p}">
      ${t('mirror_active').replace('{where}', mirrorWhere)}
      ${rootDanger}
      <div style="margin-top:8px">
        <label class="toggle" style="margin:0;display:inline-flex;align-items:center">
          <input type="checkbox" id="mirror-confirm-${p}" ${mirror?'':'disabled'} onchange="toggleMirrorConfirm('${p}')"><span></span>
        </label>
        <span style="font-size:12px;color:var(--warn);margin-left:8px"><strong>${t('mirror_confirm_label')}</strong></span>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <div style="flex:1">
        <label class="f">${t('label_interval')}</label>
        <input type="number" id="interval-${p}" value="${escapeAttr(s.interval_min||5)}" min="5">
      </div>
      <div style="margin-left:auto;text-align:center">
        <label class="f">${t('label_sync_enabled')}</label>
        <label class="toggle"><input type="checkbox" id="enabled-${p}" ${s.enabled?'checked':''} ${!canEnable?'disabled':''}><span></span></label>
        ${!canEnable?'<div style="color:var(--warn);font-size:11px;margin-top:4px">'+t('connect_first')+'</div>':''}
      </div>
      <button class="btn" onclick="saveSettings('${p}')" style="margin-left:20px">${t('btn_save')}</button>
      <button class="btn ghost" onclick="previewCmd('${p}')" style="margin-left:8px">${t('btn_preview')}</button>
    </div>
    <div class="warnbox show" id="warn-${p}" style="${canEnable||!s.enabled?'display:none':'display:block'}">
      ${t('warn_not_auth').replace('{provider}', escapeHtml(p))}
    </div>

    <!-- Dry-run preview panel -->
    <div class="card cmdprev" id="preview-panel-${p}" style="margin-top:16px;display:none">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <b style="color:var(--text)">${t('preview_title')}</b>
        <span id="preview-count-${p}" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div id="preview-deletions-note-${p}" style="color:var(--err);font-size:11.5px;margin-bottom:6px;display:none">
        ${t('preview_deletions_note').replace('{n}', '<span id="preview-del-num-${p}"></span>')}
      </div>
      <pre style="background:#0b0f18;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;line-height:1.5;overflow-x:auto;color:#9fb0d0;max-height:260px" id="preview-lines-${p}"></pre>
    </div>

    <div class="card cmdprev" style="margin-top:18px"><b style="color:var(--text)">${t('preview_effective_cmd')}</b><br>
      <code>${escapeHtml(cmdFor(s.direction, local, remoteVal||remotePlaceholder, s.mirror))}</code></div>
  `;
}

function directionOneWay(d){ return d==='upload'?'upload': d==='download'?'download': null; }

function toggleMirror(p){
  const cb = document.getElementById('mirror-'+p);
  const conf = document.getElementById('mirror-confirm-'+p);
  const warn = document.getElementById('mirror-warn-'+p);
  if(!cb) return;
  conf.disabled = !cb.checked;
  if(!cb.checked){ conf.checked = false; }
  state[p].mirror = cb.checked;   // persist so renderPane() does NOT revert the box
  warn.classList.toggle('show', !!cb.checked);
  renderPane(); // re-render to update direction disabled states & warning
}

function toggleMirrorConfirm(p){
  // nothing to do server-side; confirmation is sent with saveSettings
}

async function saveSettings(p){
  const mirrorCb = document.getElementById('mirror-'+p);
  const confirmCb = document.getElementById('mirror-confirm-'+p);
  const mirror = mirrorCb ? mirrorCb.checked : false;
  // Server enforces: mirror requires confirm_mirror. Give a friendly client alert too.
  if(mirror && (!confirmCb || !confirmCb.checked)){
    alert(t('alert_mirror_confirm'));
    return;
  }
  const btn = event && event.target ? event.target : null;
  const orig = btn ? btn.textContent : '';
  if(btn) btn.textContent='Salvando…';
  const enabled = document.getElementById('enabled-'+p).checked;
  if(enabled && !state[p].connected){
    alert(t('alert_connect_first').replace('{label}', LABELS[p]));
    if(btn) btn.textContent=orig;
    return;
  }
  const cfg = {
    provider: p,
    enabled: enabled,
    direction: state[p].direction,
    interval_min: parseInt(document.getElementById('interval-'+p).value)||5,
    remote: document.getElementById('remote-'+p).value||'',
    local_sub: (document.getElementById('localsub-'+p)||{}).value || '',
    mirror: mirror,
    confirm_mirror: mirror ? (confirmCb ? confirmCb.checked : false) : false,
  };
  try{
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 25000);
    const r = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg),signal:ctrl.signal});
    clearTimeout(to);
    const j = await r.json();
    if(btn) btn.textContent = j.ok ? '✓ Salvo' : 'Erro';
    if(j.ok){
      state[p].enabled = cfg.enabled;
      state[p].direction = cfg.direction;
      state[p].interval_min = cfg.interval_min;
      state[p].remote = cfg.remote;
      state[p].local_sub = (document.getElementById('localsub-'+p)||{}).value || state[p].local_sub;
      state[p].mirror = cfg.mirror;
      renderPane();
      setTimeout(()=>{if(btn) btn.textContent=orig;}, 900);
    } else {
      alert(j.error||j.detail||t('alert_save_fail'));
      if(btn) btn.textContent=orig;
    }
  }catch(e){
    if(btn) btn.textContent=orig;
    alert(t('alert_network_save'));
  }
}

function setDir(d){
  // If mirror is on and user picks bisync, turn mirror off (not allowed for bisync).
  if(d==='bisync' && state[active].mirror){
    state[active].mirror = false;
  }
  state[active].direction=d;
  renderPane();
}

function cmdFor(dir, local, remote, mirror){
  if(dir==='upload') return mirror
    ? `rclone sync ${local} ${remote} --backup-dir <prov>:.gdrv-deleted/<ts>`
    : `rclone copy ${local} ${remote}`;
  if(dir==='download') return mirror
    ? `rclone sync ${remote} ${local} --backup-dir ./data/deleted/<prov>/<ts>`
    : `rclone copy ${remote} ${local}`;
  return `rclone bisync ${local} ${remote} --conflict-resolve none ${t('bisync_first_run_note')}`;
}

async function previewCmd(p){
  const s = state[p] || {};
  const panel = document.getElementById('preview-panel-'+p);
  const countEl = document.getElementById('preview-count-'+p);
  const linesEl = document.getElementById('preview-lines-'+p);
  const delNote = document.getElementById('preview-deletions-note-'+p);
  const delNum = document.getElementById('preview-del-num-'+p);
  if(!panel) return;
  panel.style.display = 'block';
  linesEl.textContent = t('preview_running');
  countEl.textContent = '';
  delNote.style.display = 'none';
  try{
    const r = await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      provider: p,
      direction: state[p].direction,
      // read LIVE DOM (manually typed / popup-selected remote), not stale state
      remote: (document.getElementById('remote-'+p)||{}).value || '',
      mirror: !!(( document.getElementById('mirror-'+p)||{}).checked),
    })});
    const j = await r.json();
    if(!r.ok){
      const msg = j.error === 'mirror_root_not_allowed'
        ? t('preview_blocked_root')
        : (j.error === 'mirror_not_allowed_for_bisync'
            ? t('preview_blocked_bisync')
            : t('preview_unavailable').replace('{error}', j.error||r.status));
      linesEl.textContent = msg; countEl.textContent=''; delNote.style.display='none';
      return;
    }
    linesEl.textContent = (j.cmd||[]).join('\n') + '\n\n' + (j.lines||[]).join('\n');
    countEl.textContent = t('preview_counts').replace('{n}', j.transfers||0).replace('{m}', j.deletions||0);
    if(j.deletions && j.deletions>0){
      delNote.style.display = 'block';
      delNum.textContent = j.deletions;
    }
    if(!j.ok && j.rc){
      linesEl.textContent = t('preview_rc').replace('{rc}', j.rc)+'\n'+linesEl.textContent;
    }
  }catch(e){
    linesEl.textContent = t('preview_error').replace('{error}', String(e));
  }
}

/* ---------- connect navigation with browse picker ---------- */
let browseWin = null;
function openBrowse(p){
  const url = `/browse?provider=${encodeURIComponent(p)}`;
  browseWin = window.open(url, 'gdrv-sync-browse', 'width=700,height=520');
}
// Listen for selection from the browse popup. Keep remote exactly as sent ("gdrive:" for root).
window.addEventListener('message', ev=>{
  if(ev.origin !== window.location.origin) return;   // only trust our own browse popup
  if(!ev.data || ev.data.gdSync !== 'browse-selected') return;
  const p = ev.data.provider, remote = ev.data.remote;
  document.getElementById('remote-'+p).value = remote;
  state[p].remote = remote;
  renderPane();
});

/* ---------- dedicated folder ---------- */
async function useDedicated(p, btn){
  const warn = document.getElementById('ded-warn-'+p);
  btn.disabled = true; btn.textContent=t('btn_creating');
  try{
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 60000);
    const r = await fetch('/api/use-dedicated',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:p}),signal:ctrl.signal});
    clearTimeout(to);
    const j = await r.json();
    if(!r.ok || !j.ok){
      if(warn){ warn.textContent = '⛔ '+(j.detail||j.error||t('alert_save_fail')); warn.classList.add('show'); }
      btn.disabled=false; btn.textContent=t('btn_dedicated').replace('{dedicated}', DEDICATED);
      return;
    }
    state[p].remote = j.remote;
    renderPane();
    const w2 = document.getElementById('ded-warn-'+p);
    if(w2){ w2.classList.add('show');
      w2.textContent = j.warning ? ('⚠ '+j.warning) : t('ded_created').replace('{remote}', j.remote); }
  }catch(e){
    if(warn){ warn.textContent = t('ded_network_error').replace('{error}', e); warn.classList.add('show'); }
    btn.disabled=false; btn.textContent=t('btn_dedicated').replace('{dedicated}', DEDICATED);
  }
}

/* ---------- init ---------- */
renderTabs(); load();
</script>
{% endblock %}
